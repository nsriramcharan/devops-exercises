name: POC Build, Test & Semantic Tagging

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write # Required to create and push tags

jobs:
  # ========================================================
  # Stage 1: Continuous Integration (Tests / Build Simulation)
  # ========================================================
  ci-checks:
    name: Run Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Unit Tests
        run: |
          echo "Running tests..."
          # Replace with your test command (e.g., npm test, pytest)
          # To simulate a failure, change exit code to 1:
          exit 0

      - name: Build Code Artifacts
        run: |
          echo "Building microservice..."
          exit 0

  # ========================================================
  # Stage 2: Version Tag Calculation & Push
  # (Only runs if Stage 1 completely succeeds)
  # ========================================================
  create-tag:
    name: Generate & Push Semantic Tag
    needs: ci-checks
    if: success() # Explicitly ensures no tag is cut if Stage 1 fails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history and tags

      - name: Calculate Next Version
        id: semver
        run: |
                # 1. Pull all remote tags into the runner
                git fetch --tags --force
      
                # 2. Find the highest semantic tag across the entire repository
                LATEST_TAG=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
      
                if [ -z "$LATEST_TAG" ]; then
                  NEW_TAG="1.0.0"
                  echo "No existing tags found. Initializing to: $NEW_TAG"
                else
                  echo "Highest tag detected in repo: $LATEST_TAG"
                  
                  IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"
                  COMMIT_MSG=$(git log -1 --pretty=%B)
      
                  # Check if we should bump patch or minor
                  if echo "$COMMIT_MSG" | grep -Ei "(hotfix|bugfix|fix:)"; then
                    echo "Hotfix/fix detected. Bumping PATCH version."
                    PATCH=$((PATCH + 1))
                  else
                    echo "Standard change detected. Bumping MINOR version."
                    MINOR=$((MINOR + 1))
                    PATCH=0
                  fi
      
                  NEW_TAG="${MAJOR}.${MINOR}.${PATCH}"
                fi
      
                echo "Calculated new tag: $NEW_TAG"
                echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create and Push Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TAG="${{ steps.semver.outputs.new_tag }}"
          
          echo "Creating Git tag: $TAG"
          git tag "$TAG"
          git push origin "$TAG"
